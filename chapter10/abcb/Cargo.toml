[workspace]
members = ["crates/abcb-cli", "crates/abcb-core", "crates/abcb-tools"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/dikoko/abcb"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.23.0"
toml = "1.1.2"
